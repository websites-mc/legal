program_name:
program_description: White Collar, a dry cleaner and tailor in Lakewood, NJ offering daily pickup and delivery, sends text messages to customers who sign up, including order-ready and pickup notices, delivery and driver ETA updates, account and invoice notifications, customer service replies to questions you text us, and promotional messages such as seasonal specials.
message_types:
  - Order updates, such as when your garments or alterations are ready for pickup
  - Pickup and delivery notifications, including driver ETAs
  - Account notifications, such as invoices, receipts and balance reminders
  - Customer service replies to questions you text us
  - Promotional messages, such as seasonal specials and offers
opt_in_methods:
  - Texting JOIN to (848) 998-1106, as advertised on the sign displayed in our store and on the card attached to every delivered garment order
  - Texting us a question at (848) 998-1106, which starts a customer service conversation (you receive replies about your request only; marketing messages are sent only after you text JOIN)
